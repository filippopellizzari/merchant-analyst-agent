name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: tool-service (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -q test

  python:
    name: agent + eval (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - name: Replay recorded eval fixtures (no model or BigQuery calls)
        run: uv run python -m merchant_eval.run --replay --no-report
