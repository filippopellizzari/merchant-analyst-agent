[project]
name = "merchant-analyst"
version = "0.1.0"
description = "Virtual merchant analyst: ADK + Gemini agent over a Java gRPC BigQuery tool service, with a number-grounding eval harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=2.13,<3",
    "grpcio>=1.84",
    "protobuf>=6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "grpcio-tools>=1.84",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["merchant_analyst", "merchant_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["merchant_analyst/pb"]
